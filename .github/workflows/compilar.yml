
name: Compilar Os Dez Clas Elementares

on:
  workflow_dispatch:
  push:
    paths:
      - 'DezClansMIDlet.java'
      - 'MANIFEST.MF'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verificar código
        run: |
          test -f DezClansMIDlet.java
          test -f MANIFEST.MF
          echo "Arquivos encontrados"

      - name: Preparar compilador Java ME
        run: |
          mkdir -p ferramentas
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git ferramentas/J2ME-Loader
          find ferramentas/J2ME-Loader -type f | head -80

      - name: Guardar ferramentas para análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferramentas-java-me
          path: ferramentas/
          if-no-files-found: warn
