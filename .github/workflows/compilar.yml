
name: Compilar Os Dez Clas Elementares

on:
  workflow_dispatch:
  push:
    paths:
      - 'DezClansMIDlet.java'
      - 'MANIFEST.MF'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      
      - name: Verificar ferramentas disponíveis
        run: |
          echo "Java instalado:"
          java -version
          echo "Compilador Java:"
          javac -version
          echo "Arquivos do projeto:"
          ls -la


      - name: Verificar código
        run: |
          test -f DezClansMIDlet.java
          test -f MANIFEST.MF
          echo "Código e manifesto encontrados."

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacao
          path: ferramentas/
          if-no-files-found: warn
