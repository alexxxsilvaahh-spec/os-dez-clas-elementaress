
name: Compilar Os Dez Clas Elementares

on:
  workflow_dispatch:
  push:
    paths:
      - 'DezClansMIDlet.java'
      - 'MANIFEST.MF'
      - '.github/workflows/compilar.yml'

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preparar ferramentas Java ME
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p ferramentas classes
          wget -O ferramentas/wtk.zip https://github.com/nikita36078/J2ME-Loader/releases/download/1.7.9/WTK.zip
          unzip -oq ferramentas/wtk.zip -d ferramentas
          find ferramentas -type f | head -80

      - name: Verificar código
        run: |
          test -f DezClansMIDlet.java
          test -f MANIFEST.MF
          echo "Código e manifesto encontrados."

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-compilacao
          path: ferramentas/
          if-no-files-found: warn
