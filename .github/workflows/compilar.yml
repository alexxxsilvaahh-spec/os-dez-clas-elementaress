name: Compilar Os Dez Clas Elementares

on:
workflow_dispatch:
push:
paths:
- 'DezClansMIDlet.java'
- 'MANIFEST.MF'
- '.github/workflows/compilar.yml'

jobs:
compilar:
runs-on: ubuntu-latest
steps:
- name: Baixar codigo do jogo
uses: actions/checkout@v4

  - name: Configurar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Baixar ferramentas Java ME
    run: |
      git clone --depth 1 https://github.com/retro-systems-lab/j2me-devkit.git ferramentas-j2me
      cd ferramentas-j2me
      mkdir -p src
      cp ../DezClansMIDlet.java src/DezClansMIDlet.java
      cat > app.jad <<'JAD'
      MIDlet-Name: Os Dez Clas Elementares
      MIDlet-Version: 1.0.0
      MIDlet-Vendor: Projeto Independente
      MIDlet-1: Os Dez Clas Elementares,,com.claselementares.DezClansMIDlet
      MicroEdition-Configuration: CLDC-1.1
      MicroEdition-Profile: MIDP-2.0
      MIDlet-Jar-URL: app.jar
      JAD
      make setup

  - name: Compilar e empacotar o jogo
    run: |
      cd ferramentas-j2me
      make build
      jar umf ../MANIFEST.MF dist/app.jar
      mkdir -p ../jogo-pronto
      cp dist/app.jar ../jogo-pronto/app.jar
      cp app.jad ../jogo-pronto/app.jad
      jar tf dist/app.jar | grep -Fx 'com/claselementares/DezClansMIDlet.class'

  - name: Disponibilizar o jogo
    uses: actions/upload-artifact@v4
    with:
      name: Os-Dez-Clas-Elementares
      path: jogo-pronto/
      if-no-files-found: error
